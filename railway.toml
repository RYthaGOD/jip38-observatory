# Railway deployment.
#
# ONE service, and the reason is worth writing down because the obvious design
# is two and the obvious design silently does not work.
#
# The natural split is a web service that serves and a cron service that reads
# the chain. It was built that way first. Each Railway service is its own
# container with its own disk, so the cron service rebuilds
# dist/dashboard.html inside ITSELF and the web service goes on serving its own
# copy, which nothing ever updates. Both deployments stay green, the cron
# reports success every six hours, and the page never changes. A volume does not
# bridge it either — a volume instance binds to exactly one service.
#
# So the refresh runs inside the serving process, on a timer, writing to the
# same disk the server reads from. The server already re-reads the page when its
# mtime changes, so a completed rebuild is live on the next request. No
# synchronisation, and nothing that can drift.

[build]
builder = "NIXPACKS"
# Rebuilds the page from the COMMITTED snapshot, so a fresh deploy comes up
# serving a real page immediately rather than a 503 until the first refresh.
buildCommand = "npm run build"

[deploy]
startCommand = "node server.mjs"

# Reports whether the server actually has a page to serve, so a deploy that
# built nothing is caught here instead of being routed traffic.
healthcheckPath = "/healthz"
healthcheckTimeout = 30

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# One instance. Each would keep its own snapshot on its own disk and refresh on
# its own schedule, so two of them would serve figures from different moments
# under one URL — the "two moments presented as one" problem the rest of this
# project exists to avoid.
numReplicas = 1

# ---------------------------------------------------------------------------
# Variables
#
#   SOLANA_RPC_URL             required for the refresh. The only secret.
#   REFRESH_INTERVAL_MINUTES   360 — every six hours, matching the Windows task.
#                              Unset or 0 disables refreshing entirely, which is
#                              what a local `npm start` wants: serve what is
#                              already built, never touch the chain.
#   PORT                       8080. Railway routes to it; the server reads it.
#
# A volume must be mounted at /app/data. Railway's filesystem is otherwise
# ephemeral and resets to whatever was committed on every redeploy — and
# data/history.jsonl is the treasury series: evidence, never back-filled, and a
# lost reading cannot be recovered. Without the volume the chart silently
# restarts from the committed readings each deploy, and a shorter chart still
# looks like a chart, so nobody notices.
#
# deploy-railway.sh provisions all of this.
# ---------------------------------------------------------------------------
